<text x="103" y="97" font-size="13" fill="#c0caf5" font-weight="700" text-anchor="end">12</text>
<text x="142" y="97" font-size="13" fill="#c0caf5" font-weight="700" text-anchor="end">5</text>
<text x="186" y="97" font-size="13" fill="#c0caf5" font-weight="700" text-anchor="end">17</text>
<text x="13" y="121" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Bot = Dependabot</text>
